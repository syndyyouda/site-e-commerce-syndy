<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>feature</title>
    <link rel="stylesheet" href="css/feature.css">
</head>
<body>
    <div class="wrapper-faiture">
        <div class="container-faiture">
            <div class="wrap-faiture-title">
                <h3 class="faiture-title">Top Featured Products</h3>
                <div class="item-faiture">
                    <div class="wrap-item-faiture">
                        <div class="section-heading">
                            <SPan>You are in:</SPan>
                            <div class="text-heading">
                                <SPan>Accessories:</SPan>
                            </div>
                        </div>
                        <ul>
                            <li>
                                <a href=""><span>Accessories</span></a>
                            </li>
                            <li>
                                <a href=""><span>Computer & Laptop</span></a>
                            </li>
                            <li>
                                <a href=""><span>Clothing & Apparel</span></a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="wrap-faiture-products">
                <div class="item-faiture-products">
                    <div class="wrap-item-faiture-products">
                        <div class="content-wrap-item-faiture-products">
                            <form class="form-products">
                                <div class="item-products-left">
                                    <div class="content-image">
                                        <a href="" class="image-article">
                                            <img src="images/telephone/telp1.webp" alt="">
                                            <img src="images/telephone/telp1-1.webp" alt="">
                                        </a>
                                    </div>
                                    <div class="label-article-left-box">
                                        <div class="label-left">-20%</div>
                                    </div>
                                    <div class="interaction-box">
                                        <div class="interaction-group">
                                            <div class="inner">
                                                <a class="icon-box">
                                                    <i class="fa-solid fa-heart"></i>
                                                    <i class="icon-check"></i>
                                                    <span class="text">Add wishlist</span>
                                                    <span class="added">Delete wishlist</span>
                                                </a>
                                                <a class="icon-box">
                                                    <i class="fa-solid fa-layer-group"></i>
                                                    <i class="icon-check"></i>
                                                    <span class="text">Add compare</span>
                                                    <span class="added">Delete compare</span>
                                                </a>
                                                <a class="icon-box">
                                                    <i class="fa-solid fa-eye"></i>
                                                    <div class="laber-laoding">
                                                        <div class="cercle-laoding">
                                                            <span></span>
                                                        </div>
                                                    </div>
                                                    <span class="text">Quick view</span>
                                                </a>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="item-products-right">
                                    <div class="content-image-article">
                                        <div class="title">
                                            <h2>
                                            <a href="#" class="text-title">Apple IPad Mini 6<br>Wi-Fi Cellular...</a>
                                            </h2>
                                        </div>
                                        <div class="icon-box">
                                            <div class="icon">
                                                <div class="content-icon">
                                                    <span class="etoile">
                                                        <i class="fa-solid fa-star"></i>
                                                    </span>
                                                    <span class="etoile">
                                                        <i class="fa-solid fa-star"></i>
                                                    </span>
                                                    <span class="etoile">
                                                        <i class="fa-solid fa-star"></i>
                                                    </span>
                                                    <span class="etoile">
                                                        <i class="fa-solid fa-star"></i>
                                                    </span>
                                                    <span class="etoile">
                                                        <i class="fa-solid fa-star"></i>
                                                    </span>
                                                    <span class="etoile-text">(4 <br>reviews)</span>
                                                </div>
                                            </div>
                                        </div>
                                        <span class="price">
                                            <span>$56.00</span>
                                        </span>
                                        <div class="btn-box">
                                            <button>Add To Cart</button>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
